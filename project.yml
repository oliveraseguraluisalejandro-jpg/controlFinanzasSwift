# project.yml — Especificación de proyecto para XcodeGen
#
# Genera el .xcodeproj a partir de este archivo, de modo que el proyecto se
# pueda crear SIN Xcode (ideal, porque este sandbox es Linux). En tu Mac:
#
#   brew install xcodegen      # una sola vez
#   cd swiftui/ControlFinanzas
#   xcodegen generate
#   open ControlFinanzas.xcodeproj
#
# También puedes abrir la carpeta Sources/ directamente en Xcode 15+ y dejar
# que SwiftPM la detecte, pero XcodeGen produce un proyecto App completo.

name: ControlFinanzas
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""            # <-- pon tu Team ID si vas a firmar en dispositivo
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Control de Finanzas"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  ControlFinanzas:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ControlFinanzas
        PRODUCT_NAME: ControlFinanzas
